name: Refresh free football fixtures

on:
  push:
    paths:
      - '.github/workflows/refresh-fixtures.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Fetch next three days from API-Football free tier
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${APISPORTS_KEY:-}" ]; then
            echo "::error::Repository secret APISPORTS_KEY is missing or empty."
            exit 1
          fi
          mkdir -p data
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          : > "$tmpdir/fixtures.ndjson"
          for offset in 0 1 2; do
            day="$(date -u -d "+${offset} day" +%F)"
            echo "Fetching fixtures for ${day}"
            curl --fail --silent --show-error --get \
              --header "x-apisports-key: ${APISPORTS_KEY}" \
              --data-urlencode "date=${day}" \
              --data-urlencode "timezone=Africa/Johannesburg" \
              "https://v3.football.api-sports.io/fixtures" \
              --output "$tmpdir/${day}.json"
            if ! jq -e '(.errors | length) == 0 and (.response | type) == "array"' "$tmpdir/${day}.json" >/dev/null; then
              echo "::error::Provider returned an API error for ${day}; keeping existing published feed."
              jq '{errors, results, paging}' "$tmpdir/${day}.json" || true
              exit 1
            fi
            jq -c '.response[]' "$tmpdir/${day}.json" >> "$tmpdir/fixtures.ndjson"
          done
          jq -s --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{generated_at:$generated_at,response:.}' "$tmpdir/fixtures.ndjson" > "$tmpdir/fixtures.json"
          mv "$tmpdir/fixtures.json" data/fixtures.json
          echo "Published candidate fixture count: $(jq '.response|length' data/fixtures.json)"

      - name: Publish updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fixtures.json
          if git diff --cached --quiet; then
            echo "Fixture feed unchanged."
          else
            git commit -m "Refresh verified football fixtures"
            git push
          fi
